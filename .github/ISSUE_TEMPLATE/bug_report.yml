name: Bug report
description: Report a reproducible AI Sticky Notes error or unexpected behavior
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Please do not share ChatGPT transcripts, account IDs, access tokens, MCP URLs, private note text or unredacted screenshots.
  - type: input
    id: version
    attributes:
      label: AI Sticky Notes version
      description: Example — v0.4.26-dev, as shown in chrome://extensions
      placeholder: v0.4.26-dev
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Connection mode
      options:
        - Browser-local preview (MCP disconnected)
        - Full MCP connected
        - Not sure
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows/macOS/Linux version and Chrome version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include short steps using non-sensitive example notes
      placeholder: |
        1. Open an existing ChatGPT conversation
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and errors
      description: Include exact error text with secrets and other personal data removed
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Redacted screenshots or logs (optional)
      description: Make sure sensitive text, account IDs, other conversations and tokens are fully redacted
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private conversations, note contents, credentials, account identifiers, and secrets from this report.
          required: true
